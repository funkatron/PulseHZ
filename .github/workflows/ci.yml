name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync (dev + audio + e2e)
        run: uv sync --extra dev --extra audio --extra e2e

      - name: Install Qt/OpenGL runtime (PyQt6 on Linux)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Unit tests
        run: uv run pytest tests -q

      - name: Install Playwright Chromium
        run: uv run playwright install chromium

      - name: UI tests (Playwright)
        run: uv run pytest e2e/ -q
